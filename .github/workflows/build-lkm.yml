name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      bakasu_branch:
        required: false
        type: string
  workflow_dispatch:
jobs:
  build-lkm:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
        arch:
          - arm64
          - x86_64
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      arch: ${{ matrix.arch }}
      bakasu_branch: ${{ inputs.bakasu_branch }}
