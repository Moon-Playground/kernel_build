name: Build Kernel on AArch64

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel repository to build'
        required: true
        default: 'Mayuri-Chan/android_kernel_xiaomi_gale'
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'stable'
      kernel_defconfig:
        description: 'defconfig to build the kernel'
        required: true
        default: 'gale_defconfig'
      kernel_img:
        description: 'Kernel image name'
        required: false
        default: 'Image.gz'
      kernel_dtb:
        description: 'Kernel dtb name'
        required: false
        default: 'mediatek/mt6768.dtb'
      bakasu_branch:
        description: 'BakaSu branch'
        required: false
        default: 'main'
        type: string

jobs:
  build_kernel:
    name: Build kernel
    uses: ./.github/workflows/kernel.yml
    with:
      kernel_repo: ${{ github.event.inputs.kernel_repo }}
      kernel_branch: ${{ github.event.inputs.kernel_branch }}
      kernel_defconfig: ${{ github.event.inputs.kernel_defconfig }}
      kernel_img: ${{ github.event.inputs.kernel_img }}
      kernel_dtb: ${{ github.event.inputs.kernel_dtb }}
      bakasu_branch: ${{ github.event.inputs.bakasu_branch }}
    secrets: inherit

  build_manager:
    name: Build BakaSU manager
    uses: ./.github/workflows/manager.yml
    with:
      bakasu_branch: ${{ github.event.inputs.bakasu_branch }}
    secrets: inherit

  release:
    name: Release to GitHub
    needs: [build_kernel, build_manager]
    if: always() && needs.build_kernel.result == 'success' && needs.build_manager.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout script
        uses: actions/checkout@v7

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Download kernel normal artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-normal
          path: dist/

      - name: Download kernel ksu artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-ksu
          path: dist/

      - name: Download kernel susfs artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-susfs
          path: dist/

      - name: Download manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-repacked
          path: dist/

      - name: Release all artifacts
        run: bash build.sh release
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          KERNEL_DEFCONFIG: ${{ inputs.kernel_defconfig }}
